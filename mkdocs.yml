site_name: ML Container Creator
site_description: The BYOC toolkit for Amazon SageMaker AI — generate, deploy, tune, and operate ML containers
site_url: https://awslabs.github.io/ml-container-creator/
repo_url: https://github.com/awslabs/ml-container-creator
repo_name: awslabs/ml-container-creator
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: logo.png
  favicon: logo.png

extra_css:
  - stylesheets/extra.css
  - stylesheets/manifold.css

extra_javascript:
  - js/command-generator.js
  - js/coverage-manifold.js

plugins:
  - search
  - tags

exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Supported Models: supported-models.md
  - Bootstrap: bootstrap.md
  - MCP Servers: mcp-configuration.md
  - User Guide:
      - Configuration: configuration.md
      - Secrets Management: secrets.md
      - Deployment & Inference: deployments.md
      - Fine-Tuning: fine-tuning.md
      - Custom Training: custom-training.md
      - Agent UX: agent.md
      - Examples: EXAMPLES.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Operations:
      - CI Integration: ci-integration.md
      - Benchmarking: benchmarking.md
      - Deployment Registry: deployment-registry.md
      - Optimization: optimize.md
      - Import/Update/Regenerate: import.md
      - Prove: prove.md
      - Path Prover: path-prover.md
      - Coverage Manifold: coverage-manifold.md
  - Developer Guide:
      - Contributing: CONTRIBUTING.md
      - Local Development: dev/local-development.md
      - Architecture: how-it-works.md
      - Schema-Driven Architecture: dev/schema-driven-architecture.md
      - Template System: dev/template-system.md
      - MCP Server Development: dev/mcp-server-development.md
      - Registries and Catalogs: dev/registries-and-catalogs.md
      - Validation System: dev/validation-system.md
      - Testing: dev/testing.md
  - Command Generator: command-generator.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - codehilite:
      guess_lang: false
  - pymdownx.snippets:
      base_path: docs/snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
