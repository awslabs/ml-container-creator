[project]
name = "ml-container-creator"
version = "0.13.4"
description = "Python dependencies for ml-container-creator do/ lifecycle scripts"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120.0",
    "boto3>=1.35.0",
    "huggingface-hub>=0.25.0",
    "hf-transfer>=0.1.8",
    "pyarrow>=17.0.0",
    "questionary>=2.0.0",
    "sagemaker-core>=1.0.0",
    "sagemaker[train]>=3.0.0",
    "sagemaker[serve]>=3.0.0",
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --ignore=test/test_model_handler.py"
pythonpath = ["."]
# test/test_model_handler.py and the templates/ copies are standalone local-testing
# CLI scripts shipped into generated projects (they import code/model_handler, which
# only exists in a generated project), NOT pytest tests. Keep pytest from collecting
# them so the suite doesn't error on an unresolvable import.
# Extends (does not replace) pytest's default ignores — the defaults are listed
# explicitly so setting this option doesn't drop them (e.g. .hypothesis, .git).
norecursedirs = [
    "templates", "infra", ".mlcc", "node_modules",
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "venv", "{arch}",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
