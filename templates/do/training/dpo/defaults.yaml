# Default hyperparameters for DPO (Direct Preference Optimization) training.
#
# Precedence (lowest -> highest):
#   1. manifest.json `default` (the shipped manifest declares none)
#   2. These defaults
#   3. training/config.yaml hyperparameters section
#   4. --set KNOB=VALUE / CLI flags (--beta, --learning-rate, etc.) = interactive answers
#      (do/train -i; answers are written back to config.yaml)
#
# Value types, bounds, and prompt tiers live in manifest.json next to this file;
# a key here that the manifest does not declare is passed to train.py unchanged.
#
# NOTE: DPO creates a frozen reference model internally, doubling memory.
# For models >7B on single GPU, set reference_free: true or use multi-GPU.

beta: 0.1
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 5e-7
epochs: 1
batch_size: 2
max_length: 1024
max_prompt_length: 512
gradient_accumulation_steps: 4
warmup_ratio: 0.03
chosen_field: chosen
rejected_field: rejected
prompt_field: prompt
reference_free: false
