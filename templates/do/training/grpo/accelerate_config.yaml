# Accelerate configuration for GRPO training.
# FSDP-ready: works on both single-GPU and multi-GPU automatically.
#
# NOTE: GRPO holds the policy model AND a frozen reference model (for the KL
# term), and additionally runs on-policy generation (sampling num_generations
# completions per prompt) inside the training loop. That makes it more
# memory- and compute-hungry than SFT. For models >3B, or a large
# num_generations / max_completion_length, prefer a multi-GPU instance
# (ml.g5.12xlarge = 4× A10G = 96 GB) and/or FSDP offloading
# (fsdp_offload_params: true below).
#
# Single-GPU (ml.g5.xlarge): accelerate detects 1 GPU, runs single-process.
# Multi-GPU (ml.g5.12xlarge): accelerate detects 4 GPUs, runs FSDP.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
mixed_precision: bf16
num_processes: auto
