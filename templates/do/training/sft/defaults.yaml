# Default hyperparameters for SFT (Supervised Fine-Tuning) training.
#
# Precedence (lowest -> highest):
#   1. manifest.json `default` (the shipped manifest declares none)
#   2. These defaults
#   3. training/config.yaml hyperparameters section
#   4. --set KNOB=VALUE / CLI flags (--learning-rate, --epochs, etc.) = interactive answers
#      (do/train -i; answers are written back to config.yaml)
#
# Value types, bounds, and prompt tiers live in manifest.json next to this file;
# a key here that the manifest does not declare is passed to train.py unchanged.

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 2e-4
epochs: 3
batch_size: 4
max_seq_length: 2048
gradient_accumulation_steps: 4
warmup_ratio: 0.03
dataset_text_field: text
