        num_nodes: 1
      training_config:
        checkpoint:
          _target_: verl.trainer.config.CheckpointConfig
          load_contents:
          - model
          - optimizer
          - extra
          - hf_model
          save_contents:
          - model
          - optimizer
          - extra
          - hf_model
          save_only_adapter_if_lora: true
        data:
          _target_: verl.utils.dataset.dpo_dataset.DPODataConfig
          apply_chat_template_kwargs: {}
          chosen_key: chosen
          custom_cls:
            name: null
            path: null
          dataloader_num_workers: 8
          max_length: {{dataset_max_len}}
          max_token_len_per_gpu: 33280
          micro_batch_size_per_gpu: 1
          pad_mode: no_padding
          prompt_key: prompt
          rejected_key: rejected
          remove_invalid_samples: false
          seed: 42
          shuffle: true
          train_batch_size: {{global_batch_size}}
          train_files: '{{data_path}}'
          train_max_samples: -1
          train_val_split_ratio: {{train_val_split_ratio}}
          truncation: left
          use_dynamic_bsz: true
          use_shm: false
          val_files: '{{validation_data_path}}'
          val_max_samples: -1
        engine:
          _target_: verl.workers.config.FSDPEngineConfig
          dtype: bfloat16
          entropy_checkpointing: false
          entropy_from_logits_with_chunking: false
          forward_only: false
          forward_prefetch: false
          fsdp_size: -1
          full_determinism: false
          model_dtype: bfloat16
          offload_policy: false
          optimizer_offload: false
          param_offload: false
          reshard_after_forward: true
          seed: 42
          strategy: fsdp2
          ulysses_sequence_parallel_size: 1
          use_orig_params: false
          use_torch_compile: true
          wrap_policy:
            min_num_params: 0
        mlflow:
          run_id: '{{mlflow_run_id}}'
          tracking_uri: '{{mlflow_tracking_uri}}'
        model:
          _target_: verl.workers.config.HFModelConfig
          custom_chat_template: null
          enable_activation_offload: false
          enable_gradient_checkpointing: true
          exclude_modules: .*vision_tower.*|.*embed_vision.*|.*embed_audio.*|.*audio_tower.*|.*router.*|.*experts.*
          external_lib: null
          fused_kernel_options:
            impl_backend: torch
          hf_config_path: null
          lora_adapter_path: null
          lora_alpha: {{lora_alpha}}
          lora_dropout: 0.05
          lora_rank: {{lora_rank}}
          override_config:
            attn_implementation: flash_attention_2
          path: '{{model_name_or_path}}'
          target_modules: .*q_proj.*|.*k_proj.*|.*v_proj.*|.*o_proj.*|.*gate_proj.*|.*up_proj.*|.*down_proj.*
          tiled_mlp:
            enabled: false
            num_shards: 4
          tokenizer_path: null
          trust_remote_code: true
          use_fused_kernels: true
          use_liger: false
          use_remove_padding: true
          use_shm: false
        optim:
          _target_: verl.workers.config.FSDPOptimizerConfig
          betas:
          - 0.9
          - 0.999
          clip_grad: 1.0
          lr: {{learning_rate}}
          lr_scheduler_type: '{{lr_scheduler}}'
          lr_warmup_steps: {{warmup_steps}}
          lr_warmup_steps_ratio: {{lr_warmup_steps_ratio}}
          min_lr_ratio: {{min_lr}}
          num_cycles: 0.5
          optimizer: AdamW
          optimizer_impl: torch.optim
          override_optimizer_config: null
          total_training_steps: -1
          warmup_style: null
          weight_decay: {{weight_decay}}
        profiler:
          _target_: verl.utils.profiler.ProfilerConfig
          all_ranks: false
          enable: false
          ranks: []
          save_path: outputs/profile
          tool: torch
          tool_config:
            npu:
              _target_: verl.utils.profiler.config.NPUToolConfig
              analysis: true
              contents: []
              discrete: false
              level: level0
              name: npu
            nsys:
              _target_: verl.utils.profiler.config.NsightToolConfig
              discrete: null
              name: nsight
            torch:
              _target_: verl.utils.profiler.config.TorchProfilerToolConfig
              manual_save: true
              name: torch
              step_end: null
              step_start: 0
            torch_memory:
              _target_: verl.utils.profiler.config.TorchMemoryToolConfig
              name: torch_memory
              stack_depth: 32
              trace_alloc_max_entries: 100000
        trainer:
          beta: {{adam_beta}}
          default_hdfs_dir: null
          default_local_dir: '{{output_path}}'
          device: cuda
          experiment_name: verl-dpo
          label_smoothing: 0.0
          logger:
          - console
          - mlflow
          - tensorboard
          loss_type: sigmoid
          max_ckpt_to_keep: 3
          merge_lora_on_final_save: true
          n_gpus_per_node: 8
          nnodes: 1
          profile_interval:
          - -1
          - -1
          project_name: verl_dpo
          reference_free: false
          resume_from_path: '{{resume_from_path}}'
          resume_mode: auto
          save_freq: after_each_epoch
          test_freq: 5
          total_epochs: {{max_epochs}}
          total_training_steps: null
          training_mode: auto
        trainer_callbacks:
        - _target_: metering_callback.MeteringCallback
          output_path: /opt/ml/metering
      version: 2.0.9
