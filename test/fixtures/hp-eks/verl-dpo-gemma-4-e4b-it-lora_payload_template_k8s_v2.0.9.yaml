---
# Source: sagemaker-training/templates/training.yaml
apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: {{name}}
  namespace: {{namespace}}
  labels:
    app: {{name}}
spec:
  nprocPerNode: "8"
  replicaSpecs:
    - name: '1-nodes'
      replicas: 1
      template:
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: {{instance_type}}
          containers:
          - name: pytorch
            image: 920498770698.dkr.ecr.us-west-2.amazonaws.com/hyperpod-recipes-verl-0-7-0:verl-v1.1.6-smtj-tf58
            env:
              - name: CUDA_VISIBLE_DEVICES
                value: "0,1,2,3,4,5,6,7"
              - name: INSTANCE_TYPE
                value: "{{instance_type}}"
              - name: NCCL_DEBUG
                value: "WARN"
              - name: SLURM_NTASKS_PER_NODE
                value: "8"
              # New environmental variables for the script
              - name: GIT_REPO_URL
                value: ""
              - name: GIT_BRANCH
                value: ""
              - name: GIT_COMMIT
                value: ""
              - name: GIT_UPDATE_ADAPTER
                value: ""
              - name: NODES
                value: "1"
              - name: NTASKS_PER_NODE
                value: "8"
              - name: JOB_NAME
                value: "example-name-bszcn"
              - name: SCRIPT_PATH
                value: "/app/src/train_hp.py"
              - name: SCRIPT_ARGS
                value: "--config-path=/config --config-name=verl_config"
              - name: PRE_SCRIPT_COMMANDS
                value: ""
              - name: POST_SCRIPT_COMMANDS
                value: ""
              - name: USE_HYPERPODRUN
                value: "true"
            command:
            - /bin/bash
            - -c
            - "/opt/bin/scripts/train-script-gpu.sh 2>&1 | tee /data/training.log"
            imagePullPolicy: Always
            securityContext:
              privileged: true
            resources:
              requests:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
            volumeMounts:
            - mountPath: /data
              name: fsx-claim-volume
            - mountPath: /config
              name: training-config
            - mountPath: /dev/shm
              name: shm
            - mountPath: /var/log/aws/clusters
              name: aws-clusters-logs
              readOnly: true

          volumes:
          - name: fsx-claim-volume
            persistentVolumeClaim:
              claimName: fsx-claim
          - configMap:
              name: training-config-{{name}}
            name: training-config
          - name: shm
            hostPath:
              path: /dev/shm
              type: Directory
          - name: aws-clusters-logs
            hostPath:
              path: /var/log/aws/clusters
              type: DirectoryOrCreate
