#
# HyperPod EKS inference deployment — InferenceEndpointConfig custom resource.
#
# This single CRD replaces the previous raw Deployment/Service/ConfigMap
# manifests. The amazon-sagemaker-hyperpod-inference operator reconciles this
# resource: it creates the serving Deployment, a Service, the serving pods, and
# a SageMakerEndpointRegistration that registers a SageMaker AI endpoint named
# after metadata.name (== PROJECT_NAME).
#
# Field names verified against `kubectl explain inferenceendpointconfig
# --recursive` and the AWS docs (Deploy models from S3/FSx/Hugging Face using
# kubectl), 2026-09-16. Key confirmed shapes:
#   • spec.worker.environmentVariables[]  (NOT spec.worker.env)
#   • spec.modelSourceConfig.s3Storage.{bucketName,region} (NOT a full s3:// URI)
#   • spec.modelName is required and separate from modelSourceConfig
#
# Values marked with a shell ${...} placeholder are substituted at deploy time by
# do/deploy.d/hyperpod-eks via envsubst; EJS expressions are baked in at
# project-generation time.
#
# NOTE (BL085): speculative decoding is passed only through
# spec.worker.environmentVariables. The BYOC image owns the serve command and
# translates the values for its selected engine; spec.worker.args remains empty.
apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: my-model
  namespace: ml-inference
  labels:
    app: my-model
    framework: transformers
    managed-by: ml-container-creator
  annotations:
    mlcc.aws/project-name: "my-model"
    mlcc.aws/model-id: "meta-llama/Llama-3.1-8B"

spec:
  # SageMaker AI endpoint name == metadata.name == PROJECT_NAME.
  # spec.modelName identifies the model being served (HF model ID or S3 path prefix).
  # The SageMaker endpoint name comes from metadata.name (= PROJECT_NAME).
  modelName: "meta-llama/Llama-3.1-8B"
  endpointName: "my-model"
  # BL096: instanceType is resolved at DEPLOY time (not baked in at generation
  # time) so that changing the instance group via --reconfigure/--force keeps
  # the CRD's instanceType, GPU count, and CPU/memory requests in sync.
  # do/deploy.d/hyperpod-eks exports HP_INSTANCE_TYPE (from do/config) and the
  # auto-detected HP_GPU_COUNT / HP_CPU_REQUEST / HP_MEM_REQUEST before envsubst.
  # The :- default is a generation-time fallback for tools that render the raw
  # template without running envsubst (e.g. YAML lint / property tests).
  instanceType: "ml.g5.12xlarge"
  invocationEndpoint: v1/chat/completions
  replicas: 2
  # ── Model source ────────────────────────────────────────────────────────────
  # do/deploy renders exactly one modelSourceConfig block below, depending on
  # the resolved model source (checked in this precedence order):
  #   1. model-package — OPTIMIZE_MODEL_PACKAGE_ARN set (SageMaker Inference
  #      Optimizer result). Emits:
  #        modelSourceConfig:
  #          modelSourceType: model-package
  #          modelPackageArn: "<arn>"
  #      When this branch is active and OPTIMIZE_INFERENCE_SPEC is set, do/deploy
  #      also overrides spec.modelName (above) with the inference spec name for
  #      traceability.
  #   2. s3          — STAGED_MODEL_PATH set (model staged to S3).
  #   3. huggingFace — default; pulls MODEL_NAME via the hf-token-secret Secret.
  # The MODEL_SOURCE_CONFIG marker is replaced by do/deploy.d/hyperpod-eks before
  # apply; the operator downloads the model into worker.modelVolumeMount.mountPath.
  modelSourceConfig:
    modelSourceType: s3
    prefetchEnabled: false
    s3Storage:
      bucketName: zz-core
      region: us-east-1
    modelLocation: models/meta-llama/Llama-3.1-8B
  worker:
    image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/x:my-model-latest
    modelInvocationPort:
      # MLCC BYOC images serve on 8080 (SageMaker BYOC contract). The baked-in
      # ENTRYPOINT (code/serve) starts the model server on this port.
      containerPort: 8080
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    resources:
      requests:
        # BL096: cpu/memory scale with GPU count. The deploy driver recomputes
        # these from the (possibly changed) instance group and exports
        # HP_CPU_REQUEST / HP_MEM_REQUEST before envsubst. The :- defaults below
        # are computed once at generation time (cpu = gpu*4, mem = gpu*16 Gi) as
        # a fallback for raw-template renders.
        cpu: "40"
        memory: "160Gi"
        nvidia.com/gpu: "4"

      limits:
        nvidia.com/gpu: "4"

    # ── Serve flags ───────────────────────────────────────────────────────────
    # Left empty for BL088: the MLCC image ENTRYPOINT owns the serve command.
    # BL085 injects vLLM/SGLang speculative-decoding flags here.
    args: []
    environmentVariables:
      # MODEL_SOURCE steers the BYOC entrypoint (code/serve resolve_model):
      # "s3" makes it use the pre-mounted model at /opt/ml/model that the
      # operator downloaded via modelSourceConfig; "huggingface" makes the
      # server pull MODEL_NAME directly.
      - name: MODEL_SOURCE
        value: "${HP_MODEL_SOURCE}"
      # HF_TOKEN injected from the hf-token-secret K8s Secret (optional=true so
      # the pod still starts for public models or when STAGED_MODEL_PATH is set).
      # Also needed by do/benchmark for tokenizer access on gated models.
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token-secret
            key: token
            optional: true
      # ── Tier-1 engine config (ADR-010) ──────────────────────────────────────
      # DERIVED from serve.d/<engine>/manifest.json capability_map by the deploy
      # driver (serve_manifest.py resolve_capability_vars) and spliced here. This
      # replaces the previously hardcoded VLLM_TENSOR_PARALLEL_SIZE / VLLM_MODEL /
      # SGLANG_MODEL_PATH / VLLM_ENABLE_LORA lines: the block now carries ONLY the
      # active engine's keys (no cross-engine leak), honors value-shape (boolean
      # caps → bare flag; unset valued caps omitted), and never emits a companion-
      # gated flag bare (e.g. SGLang --enable-lora without rank/target-modules).
      - name: MODEL_ID
        value: "/opt/ml/model"
      # Both engine-specific speculative variable sets are emitted. The image
      # selects one set based on its model server; no speculative flags are
      # injected into worker.args.
      - name: VLLM_SPECULATIVE_ALGORITHM
        value: "${VLLM_SPECULATIVE_ALGORITHM}"
      - name: VLLM_SPECULATIVE_MODEL
        value: "${VLLM_SPECULATIVE_MODEL}"
      - name: VLLM_SPECULATIVE_NUM_TOKENS
        value: "${VLLM_SPECULATIVE_NUM_TOKENS}"
      # DSpark (Kimi-K3) sample-method knobs. Emitted unconditionally with the
      #  empty-default placeholder (like VLLM_ENABLE_LORA, BL127) so
      # envsubst can fill them at deploy time without an image rebuild. Non-dspark
      # algorithms leave them empty and the serve wrapper omits them from the
      # --speculative-config JSON.
      - name: VLLM_SPECULATIVE_DRAFT_SAMPLE_METHOD
        value: ""
      - name: VLLM_SPECULATIVE_REJECTION_SAMPLE_METHOD
        value: ""
      - name: SGLANG_SPECULATIVE_ALGORITHM
        value: "${SGLANG_SPECULATIVE_ALGORITHM}"
      - name: SGLANG_SPECULATIVE_DRAFT_MODEL_PATH
        value: "${SGLANG_SPECULATIVE_DRAFT_MODEL_PATH}"
      - name: SGLANG_SPECULATIVE_NUM_STEPS
        value: "${SGLANG_SPECULATIVE_NUM_STEPS}"
      - name: SGLANG_SPECULATIVE_EAGLE_TOPK
        value: "${SGLANG_SPECULATIVE_EAGLE_TOPK}"
      # LoRA is now part of the DERIVED Tier-1 block above (ADR-010): the deploy
      # driver resolves HP_LORA_ENABLED through the active engine's capability_map,
      # so vLLM gets a bare --enable-lora while SGLang's companion-gated toggle is
      # omitted unless its rank/target-modules are set — no hardcoded
      # VLLM_ENABLE_LORA line that would leak the wrong prefix onto other engines.

      # Tier-2 prefix pass-through (ADR-010): any <PREFIX>* var set in do/config
      # for the ACTIVE engine that is not already a Tier-1 or speculative key is
      # injected here verbatim by the deploy driver, with zero MLCC enumeration.
      # (Marker name kept for compatibility with the generate-time frozen YAML.)
      - name: VLLM_MAX_MODEL_LEN
        value: "8192"
